services:
  - type: web
    name: biomentor-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false      # You will paste this in the Render dashboard
      - key: DATA_DIR
        value: /data
    disk:
      name: biomentor-data
      mountPath: /data
      sizeGB: 1
